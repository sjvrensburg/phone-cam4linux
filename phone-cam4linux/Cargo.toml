[package]
name = "phone-cam4linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stream an Android phone's camera to a Linux V4L2 (video4linux) device"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
openh264 = { workspace = true, features = ["source"] }
v4l.workspace = true
ffmpeg-next = { workspace = true, optional = true }

[features]
default = []
# Decode with the system FFmpeg (libavcodec's native h264 decoder) instead of the
# bundled openh264, lifting the 3840x2160-class size ceiling. Needs libavcodec/
# libavutil development headers at build time and a full (non "-free") FFmpeg.
ffmpeg = ["dep:ffmpeg-next"]

[build-dependencies]
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
env_logger.workspace = true
