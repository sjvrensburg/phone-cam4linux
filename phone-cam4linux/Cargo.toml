[package]
name = "phone-cam4linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stream an Android phone's camera to a Linux V4L2 (video4linux) device"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
openh264 = { workspace = true, features = ["source"] }
v4l.workspace = true

[build-dependencies]
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
env_logger.workspace = true
