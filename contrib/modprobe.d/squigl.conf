# Options applied whenever v4l2loopback is loaded: create /dev/video10 as "Android Cam".
# Pair with contrib/modules-load.d/squigl.conf to load it at boot, so squigl-cli
# never needs to escalate (pkexec) to create the device.
#
# If something else (e.g. OBS) also loads v4l2loopback, its modprobe becomes a no-op
# and only the devices listed here exist; add more entries (video_nr=10,11) if needed.
options v4l2loopback video_nr=10 card_label="Android Cam" exclusive_caps=1
