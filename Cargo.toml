[workspace]
resolver = "2"
members = ["phone-cam4linux", "crates/pc4l"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/stefan/phone-cam4linux"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
openh264 = "0.9"
v4l = "0.14"
